<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Lorem Ipsum</title>
    
    <link rel="icon" href="image_15.png">
    <link rel="apple-touch-icon" href="image_15.png">

    <style>
        :root { --main: #333; --bg: #fff; --accent: #eee; --input-bg: #fafafa; --radius: 15px; }
        
        * { 
            -webkit-touch-callout: none !important; 
            -webkit-user-select: none !important; 
            user-select: none !important; 
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); display: flex; justify-content: center; 
            padding: 0; margin: 0; color: var(--main); -webkit-font-smoothing: antialiased; 
            height: 100vh; overflow: hidden;
        }

        .container { 
            width: 100%; max-width: 380px; height: 100vh; 
            display: flex; flex-direction: column; position: relative; 
            padding: 10px 20px 20px; box-sizing: border-box; 
        }

        .main-unit {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        
        header { 
            display: flex; justify-content: space-between; align-items: start; 
            margin-bottom: 12px; padding-top: 5px;
        }
        .title-group h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.8px; margin: 0; }
        .subtitle { font-size: 0.8rem; color: #777; font-weight: 500; margin-top: 4px; }

        .hub-link { 
            text-decoration: none; font-size: 0.7rem; font-weight: 800; color: #999; 
            background: transparent; border: 1px solid #ddd; padding: 3px 8px; border-radius: 10px; 
            transition: 0.2s; cursor: pointer;
        }
        .hub-link:active { transform: scale(0.95); background: var(--accent); color: var(--main); }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .gen-btn {
            background-color: #fff; color: var(--main);
            border: 2px solid var(--accent); border-radius: var(--radius);
            padding: 14px 5px; font-size: 0.85rem; font-weight: 800;
            cursor: pointer; transition: 0.15s; -webkit-appearance: none;
        }
        .gen-btn.active { background-color: var(--main); color: #fff; border-color: var(--main); }
        .gen-btn:active { transform: scale(0.97); }

        .status-msg {
            height: 24px; text-align: center; font-size: 0.7rem;
            font-weight: 800; color: #4CAF50; margin-bottom: 4px;
        }

        textarea { 
            width: 100%; flex-grow: 1; padding: 18px; border: 2px solid var(--accent); border-radius: var(--radius); 
            box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; 
            font-weight: 500; background: var(--input-bg);
            line-height: 1.6; resize: none; margin-bottom: 15px;
            -webkit-appearance: none; -webkit-text-fill-color: #333; opacity: 1 !important;
            user-select: auto !important; -webkit-user-select: auto !important; 
        }
        textarea.flash { background: #fff !important; border-color: #aaa !important; transition: none; }

        footer { padding: 15px 0 25px; text-align: center; border-top: 1px solid #f5f5f5; font-size: 11px; color: #666; font-weight: 600; }
        .footer-btns { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        
        .outline-btn { 
            background: #fff; color: var(--main); border: 2px solid var(--main); 
            padding: 10px; border-radius: var(--radius); text-decoration: none; 
            font-weight: 800; font-size: 12px; display: flex; align-items: center; 
            justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .outline-btn:active { background: var(--accent); transform: scale(0.97); }

        .footer-info { line-height: 1.6; }
        .footer-info a { color: inherit; text-decoration: underline; display: inline-block; padding: 4px; }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; width: 85%; max-width: 340px; padding: 30px; border-radius: var(--radius); position: relative; text-align: left; }
        .close-x { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #888; cursor: pointer; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="main-unit">
        <header>
            <div class="title-group">
                <h1>Lorem Ipsum</h1>
                <p class="subtitle">Dummy text for designers.</p>
            </div>
            <a href="https://afrorakda.github.io/" class="hub-link">🏠 Hub</a>
        </header>
        
        <div class="btn-group">
            <button class="gen-btn" id="btn-1" onclick="generate(1, this)">Short</button>
            <button class="gen-btn" id="btn-3" onclick="generate(3, this)">Medium</button>
            <button class="gen-btn" id="btn-5" onclick="generate(5, this)">Long</button>
        </div>

        <div class="status-msg" id="status"></div>
        
        <textarea id="output-box" placeholder="Tap button to generate & copy..." readonly onclick="copyText()"></textarea>
    </div>

    <footer>
        <div class="footer-btns">
            <a href="https://ko-fi.com/afrorakda" target="_blank" class="outline-btn" id="kofi-link">☕️buy me a coffee</a>
            <button class="outline-btn" onclick="showModal()" id="install-text">Add to Home Screen</button>
        </div>
        <div class="footer-info">
            No login / No tracking / No ads / Browser only<br>
            <a href="https://afrorakda.com/privacy/" id="privacy-link">Privacy Policy</a><br>
            <span id="copyright">Lorem Ipsum © 2026</span>
        </div>
    </footer>
</div>

<div id="modal" onclick="hideModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-x" onclick="hideModal()">×</span>
        <h3 id="modal-title" style="margin-top:0;">Install App</h3>
        <p id="modal-msg" style="font-size:14px; font-weight:600;">Add to home screen for easy access.</p>
        <p id="modal-ios" style="font-size:13px; color:#666;">iOS: Tap Share then 'Add to Home Screen'.</p>
        <p id="modal-android" style="font-size:13px; color:#666;">Android: Tap Menu then 'Add to home screen'.</p>
    </div>
</div>

<script>
    const wordsArr = "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua ut enim ad minim veniam quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt in culpa qui officia deserunt mollit anim id est laborum".split(' ');
    
    function generateParagraph() {
        let p = [];
        const length = 30 + Math.floor(Math.random() * 30);
        for (let i = 0; i < length; i++) {
            p.push(wordsArr[Math.floor(Math.random() * wordsArr.length)]);
        }
        let s = p.join(' ');
        return s.charAt(0).toUpperCase() + s.slice(1) + ".";
    }

    function generate(pCount, btn) {
        let paragraphs = [];
        for (let i = 0; i < pCount; i++) {
            paragraphs.push(generateParagraph());
        }
        const finalContent = paragraphs.join('\n\n');
        const output = document.getElementById('output-box');
        output.value = finalContent;
        
        document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        output.classList.add('flash');
        setTimeout(() => output.classList.remove('flash'), 150);

        copyText(pCount);
    }

    function copyText(pCount) {
        const output = document.getElementById('output-box');
        if (!output.value) return;
        
        navigator.clipboard.writeText(output.value).then(() => {
            const status = document.getElementById('status');
            const unit = pCount === 1 ? "Paragraph" : "Paragraphs";
            status.innerText = `✨ ${pCount} ${unit} generated & copied!`;
            setTimeout(() => { status.innerText = ""; }, 1800);
        });
    }

    function showModal() { document.getElementById('modal').style.display = 'flex'; }
    function hideModal() { document.getElementById('modal').style.display = 'none'; }

    async function loadFooter() {
        try {
            const response = await fetch('footer.json');
            if (!response.ok) return;
            const data = await response.json();
            if(data.kofi) { document.getElementById('kofi-link').href = data.kofi.url; document.getElementById('kofi-link').textContent = data.kofi.text; }
            if(data.install) {
                document.getElementById('install-text').textContent = data.install.text;
                document.getElementById('modal-title').textContent = data.install.title;
                document.getElementById('modal-msg').textContent = data.install.msg;
                document.getElementById('modal-ios').textContent = data.install.ios;
                document.getElementById('modal-android').textContent = data.install.android;
            }
            if(data.privacy) document.getElementById('privacy-link').href = data.privacy.url;
        } catch (e) { console.error("Footer update skipped."); }
    }
    window.addEventListener('DOMContentLoaded', loadFooter);
</script>

</body>
</html>
